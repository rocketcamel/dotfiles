resources:
  requests:
    cpu: 1
    memory: 7Gi
  limits:
    memory: 8Gi
    cpu: 2500m

minecraftServer:
  eula: "TRUE"
  type: "FABRIC"
  version: "26.1.2"
  difficulty: hard
  motd: "A Minecraft Server."
  memory: 7G
  rcon:
    enabled: true
    withGeneratedPassword: false
    port: 25575
    existingSecret: rcon-credentials
    secretKey: rcon-password
  modUrls:
    - https://github.com/gnembon/fabric-carpet/releases/download/v26.1/fabric-carpet-26.1+v260402.jar
    - https://cdn.modrinth.com/data/XpzGz7KD/versions/kJxyTnJz/elytratrims-fabric-4.8.0%2B26.1.2.jar?mr_download_reason=standalone
    - https://cdn.modrinth.com/data/VSNURh3q/versions/utLSz8Lf/c2me-fabric-mc26.1.2-0.3.7%2Balpha.0.68.jar?mr_download_reason=standalone
    - https://cdn.modrinth.com/data/wEhW4ceB/versions/7g49TsaL/tree-vein-miner-26.1.jar?mr_download_reason=standalone
  modrinth:
    projects:
      - fabric-api
      - lithium
      - servux
      - ferrite-core
      - fabric-language-kotlin
      - scalablelux
      - no-chat-reports
      - pickup-notifications
      # - ct-overhaul-village
      # - lithostitched

nodeSelector:
  kubernetes.io/hostname: kube

persistence:
  dataDir:
    enabled: true
    Size: 14Gi

sidecarContainers:
  - name: backup
    image: itzg/mc-backup
    imagePullPolicy: Always
    env:
      - name: RCON_PASSWORD
        valueFrom:
          secretKeyRef:
            name: rcon-credentials
            key: rcon-password
      - name: BACKUP_METHOD
        value: tar
      - name: BACKUP_INTERVAL
        value: "15m"
      - name: INITIAL_DELAY
        value: "5m"
      - name: PRUNE_BACKUPS_COUNT
        value: "15"
      - name: DEST_DIR
        value: /mnt/backups
      - name: LINK_LATEST
        value: "true"
      - name: TAR_COMPRESS_METHOD
        value: gzip
      - name: BACKUP_NAME
        value: minecraft-main
      - name: TZ
        value: "America/Vancouver"
    volumeMounts:
      - name: datadir
        mountPath: /data
        readOnly: true
      - name: backups
        mountPath: /mnt/backups

extraVolumes:
  - volumeMounts:
      - name: backups
        mountPath: /mnt/backups
    volumes:
      - name: backups
        nfs:
          server: 192.168.27.2
          path: /backup/minecraft
