resources:
  requests:
    cpu: 1
    memory: 6Gi
  limits:
    memory: 7Gi
    cpu: 2000m

minecraftServer:
  eula: "TRUE"
  type: "FABRIC"
  version: "26.2"
  difficulty: hard
  motd: "A Minecraft Server."
  gameMode: creative
  memory: 6G
  rcon:
    enabled: true
    withGeneratedPassword: false
    port: 25575
    existingSecret: rcon-credentials
    secretKey: rcon-password
  modUrls:
    - https://cdn.modrinth.com/data/VSNURh3q/versions/XFuLpTDt/c2me-fabric-mc26.2-0.4.2-alpha.0.8.jar?mr_download_reason=standalone
  modrinth:
    projects:
      - fabric-api
      - lithium
      - servux
      - ferrite-core
      - fabric-language-kotlin
      - scalablelux

      - carpet
      - elytra-trims
      - tree-vein-miner
      - axiom

      - no-chat-reports
      - pickup-notifications
      # - ct-overhaul-village
      # - lithostitched

nodeSelector:
  kubernetes.io/hostname: kube

persistence:
  dataDir:
    enabled: true
    Size: 50Gi
