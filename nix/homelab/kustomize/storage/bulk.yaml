apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  namespace: media
spec:
  storageClassName: bulk
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 3Ti
---
apiVersion: v1
kind: Service
metadata:
  name: media-nfs
  namespace: longhorn-system
spec:
  type: LoadBalancer
  selector:
    longhorn.io/managed-by: longhorn-manager
    longhorn.io/share-manager: pvc-dc6c7d1f-f7e0-4037-b03b-970d11deeeec
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: misc
  namespace: longhorn-system
spec:
  storageClassName: bulk
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 3Ti
