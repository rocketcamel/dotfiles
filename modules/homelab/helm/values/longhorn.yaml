defaultSettings:
  defaultReplicaCount: 2
  defaultDataLocality: best-effort
  taintToleration: "graphics=true:NoSchedule"
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod

defaultBackupStore:
  backupTarget: nfs://192.168.27.2:/backup/longhorn

persistence:
  defaultClassReplicaCount: 2
  defaultDataLocality: best-effort

longhornManager:
  tolerations:
    - key: "graphics"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

longhornDriver:
  tolerations:
    - key: "graphics"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
