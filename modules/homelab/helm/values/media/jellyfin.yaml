persistence:
  media:
    enabled: false
  config:
    size: 10Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 4
    memory: 4Gi

securityContext:
  privileged: true

tolerations:
  - key: "graphics"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

nodeSelector:
  gpu: nvidia

jellyfin:
  env:
    - name: LD_LIBRARY_PATH
      value: "/usr/lib/x86_64-linux-gnu/nvidia"

volumeMounts:
  - name: library
    mountPath: /mnt/data/media
  - name: dri
    mountPath: /dev/dri
  - name: nvidia-libs
    mountPath: /usr/lib/x86_64-linux-gnu/nvidia
    readOnly: true
  - name: nix-store
    mountPath: /nix/store
    readOnly: true

volumes:
  - name: library
    persistentVolumeClaim:
      claimName: media
  - name: dri
    hostPath:
      path: /dev/dri
      type: Directory
  - name: nvidia-libs
    hostPath:
      path: /run/opengl-driver/lib
      type: Directory
  - name: nix-store
    hostPath:
      path: /nix/store
      type: Directory
